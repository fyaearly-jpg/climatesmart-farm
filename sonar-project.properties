# sonar-project.properties — konfigurasi analisis SonarQube Cloud (Bab k & m)
#
# WAJIB DIGANTI dengan nilai dari akunmu di https://sonarcloud.io
# (Project > Information: "Project Key" dan "Organization Key"):
sonar.projectKey=sonar.projectKey=fyaearly-jpg_climatesmart-farm
sonar.organization=sonar.organization=fyaearly-jpg
sonar.projectName=ClimateSmart Farm

sonar.sourceEncoding=UTF-8

# Kode aplikasi yang dianalisis
sonar.sources=app,components,hooks,lib,store,proxy.ts
sonar.exclusions=**/node_modules/**,.next/**,coverage/**,**/*.d.ts,**/*.css

# Test (Vitest) — dipisah dari kode aplikasi supaya tidak dihitung sebagai source
sonar.tests=tests

# Laporan coverage LCOV dari `npm run test:coverage` (vitest.config.mts)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
